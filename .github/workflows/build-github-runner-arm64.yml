name: Build Github Action Runner ARM64
on:
  # Manual trigger
  workflow_dispatch:

  # Weekly schedule - runs every Sunday at 00:00 UTC
  schedule:
    - cron: '0 9 17 * *'

env:
  DOCKERHUB_REPO: anthonysautomations/github-runner

jobs:
  build_and_push_job:
    runs-on: ARM64
    name: Build and Push Job

    steps:
      - name: Display Selected Branch
        run: |
          echo "Using branch: ${{ github.ref }}"

      - name: Generate ISO timestamp tag
        id: timestamp
        run: echo "tag=$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled
          ref: ${{ inputs.branch || github.ref }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.timestamp.outputs.tag }}
          # Add Git hash as image label for traceability
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Build arguments to embed Git hash in the image
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Images cleanup
        run: |
          docker image prune -f

      - name: Add build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ env.DOCKERHUB_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:** latest, ${{ steps.timestamp.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Hash:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
