# Publishes the runner image under the immutable tag contract described in
# renovate.example/image-versioning.md: YYYY.MM.DD.N-<arch>, allocated by
# scripts/allocate-version.sh. The date moves on every rebuild, which is the
# event that matters here - most releases carry no source change, only newer
# upstream packages - and the arch suffix keeps this arm64-only pipeline from
# offering its images to amd64 consumers.
name: Build Github Action Runner ARM64
on:
  # Manual trigger
  workflow_dispatch:

  # Monthly schedule - runs on the 17th at 09:00 UTC
  schedule:
    - cron: '0 9 17 * *'

permissions:
  contents: read

env:
  DOCKERHUB_REPO: anthonysautomations/github-runner
  ARCH: arm64

# The availability check runs at allocation time, not at push time, so two
# overlapping runs could otherwise both see the same sequence number as free.
concurrency:
  group: build-github-runner-arm64
  cancel-in-progress: false

jobs:
  build_and_push_job:
    runs-on: ARM64
    name: Build and Push Job

    steps:
      - name: Display Selected Branch
        run: |
          echo "Using branch: ${{ github.ref }}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled

      - name: Allocate release version
        id: version
        env:
          # Docker Hub hides private repositories behind anonymous 404s, which
          # would defeat the allocator's fail-closed immutability check.
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(./scripts/allocate-version.sh "${DOCKERHUB_REPO}" "${ARCH}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Collect image metadata
        id: meta
        run: |
          set -euo pipefail

          # The pin is static source, so reading it from the Dockerfile cannot
          # drift from what the build resolves. Skip build flags so this stays
          # correct if a future FROM adds --platform.
          base=$(awk '/^FROM / { for (field = 2; field <= NF; field++) if ($field !~ /^--/) { print $field; exit } }' github-runner/Dockerfile) \
            || { echo "::error::No FROM line in github-runner/Dockerfile"; exit 1; }
          [[ -n "${base}" ]] || { echo "::error::No base image in github-runner/Dockerfile"; exit 1; }
          base=${base#FROM }
          echo "base=${base%% *}" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./github-runner
          file: ./github-runner/Dockerfile
          push: true
          # Generated by BuildKit from the exact image being pushed, so the
          # package inventory cannot describe a different index snapshot.
          sbom: true
          # latest-arm64 is a moving convenience alias; only the versioned tag
          # is ever deployed.
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.version.outputs.version }}-${{ env.ARCH }}
            ${{ env.DOCKERHUB_REPO }}:latest-${{ env.ARCH }}
          # Add Git hash as image label for traceability
          labels: |
            org.opencontainers.image.title=github-runner
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            com.anthonysautomations.github-runner.base.image=${{ steps.meta.outputs.base }}
          # Build arguments to embed Git hash in the image
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Images cleanup
        if: always()
        run: |
          docker image prune -f

      - name: Add build summary
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.version }}-${ARCH}"
          {
            echo "## Build Summary"
            echo "- **Repository:** ${DOCKERHUB_REPO}"
            echo "- **Release tag:** \`${tag}\`"
            echo "- **Moving alias:** \`latest-${ARCH}\`"
            echo "- **Base image:** ${{ steps.meta.outputs.base }}"
            echo "- **Git Hash:** ${{ github.sha }}"
            # Releases are unattended and machine-named, so link straight to the artefact.
            echo "- **Registry:** https://hub.docker.com/r/${DOCKERHUB_REPO}/tags?name=${tag}"
          } >> "$GITHUB_STEP_SUMMARY"
